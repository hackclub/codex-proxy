services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: codexproxy
      POSTGRES_PASSWORD: codexproxy
      POSTGRES_DB: codexproxy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codexproxy -d codexproxy"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://codexproxy:codexproxy@postgres:5432/codexproxy?sslmode=disable
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - go-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  go-cache:

